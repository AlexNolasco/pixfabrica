[project]
name = "pixfabrica-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=10.0.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
audio = [
    "httpx>=0.27",
    "librosa>=0.10",
    "scipy>=1.11",
    "soundfile>=0.12",
]
fonts = [
    "fonttools>=4.53",
    "brotli>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixfabrica_core"]
