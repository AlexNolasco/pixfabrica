[project]
name = "pixfabrica-std-effects"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Alex Nolasco" }
]
dependencies = [
    "moderngl>=5.12.0",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "pixfabrica-core>=0.1.0",
    "skia-python>=144.0.post2",
]

[tool.uv.sources]
pixfabrica-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixfabrica_std_effects"]

[project.entry-points."pixfabrica.nodes"]
std_effects = "pixfabrica_std_effects:Plugin"
