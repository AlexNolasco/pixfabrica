[project]
name = "pixfabrica"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["core", "api", "renderer", "cli", "plugins/std", "plugins/std_effects"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# CRITICAL: This forces the workspace to use the local codebase 
# for pixfabrica-core instead of looking on PyPI!
pixfabrica-api = { workspace = true }
pixfabrica-cli = { workspace = true }
pixfabrica-core = { workspace = true }
pixfabrica-renderer = { workspace = true }
pixfabrica-std = { workspace = true }
pixfabrica-std-effects = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",         # async test client for FastAPI
    "ruff>=0.6",
    "pyright>=1.1",
    "fonttools>=4.53",
    "brotli>=1.1",
    # Workspace packages — plain `uv sync` must install enough to run pytest from the root.
    "pixfabrica-api",
    "pixfabrica-cli",
    "pixfabrica-renderer",
    "pixfabrica-std",
    "pixfabrica-std-effects",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "pixfabrica_core",
    "pixfabrica_api",
    "pixfabrica_renderer",
    "pixfabrica_cli",
    "pixfabrica_std",
    "pixfabrica_std_effects",
]

# ── Pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "api/tests", "renderer/tests", "cli/tests", "plugins/std_effects/tests"]
addopts = "--tb=short"
markers = [
    "ffmpeg: integration test that runs real ffmpeg encode (slow; skip with -m 'not ffmpeg')",
]
