[project]
name = "pixfabrica-renderer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pixfabrica-core[audio]>=0.1.0",
    "numpy>=1.26",
    "skia-python>=144.0",
    "av>=12",              # PyAV — video decode
    "soundfile>=0.12",     # audio I/O
    "scipy>=1.13",         # FFT / signal processing
    "moderngl>=5.12.0",
]

[tool.uv.sources]
pixfabrica-core = { workspace = true }

[project.scripts]
px-loop = "pixfabrica_renderer.loop:main"
px-loop-movie = "pixfabrica_renderer.loop_movie:main"
px-loop-sound = "pixfabrica_renderer.loop_sound:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixfabrica_renderer"]
